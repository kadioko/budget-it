name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 6 * * 1,3,5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase keep-alive function
        run: |
          curl --fail --show-error --silent \
            --request GET "${{ secrets.SUPABASE_URL }}/functions/v1/keep-alive" \
            --header "x-keep-alive-secret: ${{ secrets.SUPABASE_KEEP_ALIVE_SECRET }}"
